<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
</head>
<body>
    <main>
        <h1>Sistema de Notas</h1>

        <label for="nota1">Primeira nota:</label>
        <input type="number" id="nota1" placeholder="Ex.: 8">

        <label for="nota2">Segunda nota:</label>
        <input type="number" id="nota2" placeholder="Ex.: 7">

        <label for="nota3">Terceira nota:</label>
        <input type="number" id="nota3" placeholder="Ex.: 6">

        <button type="button" id="calcular">Calcular média</button>

        <p id="resultado">O resultado aparecerá aqui.</p>
        <p id="finalizacao"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
